# ============================================================
# APPLICATION
# ============================================================

spring.application.name=portable_health_record_system
server.port=${SERVER_PORT:8000}

# ============================================================
# DATABASE - SUPABASE POSTGRESQL
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=PHR-HikariPool

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
spring.flyway.locations=classpath:db/migration

# ============================================================
# JWT
# ============================================================

app.jwt.secret=${PHR_JWT_SECRET}
app.jwt.access-ttl-minutes=${PHR_JWT_ACCESS_TTL_MINUTES:30}
app.jwt.refresh-ttl-days=${PHR_JWT_REFRESH_TTL_DAYS:30}

# ============================================================
# OTP
# ============================================================

app.otp.ttl-minutes=${PHR_OTP_TTL_MINUTES:5}
app.otp.max-attempts=${PHR_OTP_MAX_ATTEMPTS:5}
app.otp.expose-in-response=${PHR_OTP_EXPOSE_IN_RESPONSE:true}

# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${PHR_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# ============================================================
# SWAGGER / OPENAPI
# ============================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO
logging.level.com.portable_health_record_system=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO



























