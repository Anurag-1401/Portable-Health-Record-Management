services:

  backend:
    build:
      context: ./portable_health_record_system
    container_name: phr-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: phr-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped